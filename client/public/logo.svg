<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 180 50"
  width="260"
  height="50"
>
  <!-- Compass circle -->
  <circle
    cx="25"
    cy="25"
    r="20"
    stroke="#d97706"
    stroke-width="4"
    fill="none"
  />

  <!-- Compass needle (a rotated diamond) -->
  <polygon
    points="25,12 30,25 25,38 20,25"
    fill="#d97706"
    transform="rotate(45 25 25)"
  />

  <!-- Text -->
  <text
    x="60"
    y="32"
    font-family="Arial, sans-serif"
    font-size="24"
    fill="#d97706"
  >
    travellog
  </text>
</svg>
